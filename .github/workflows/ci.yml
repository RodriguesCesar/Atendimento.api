name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Atendimento.api.slnx

      - name: Build
        run: dotnet build Atendimento.api.slnx --configuration Release --no-restore

      - name: Test projects
        shell: pwsh
        run: |
          $testProjects = Get-ChildItem -Path . -Recurse -Filter *.csproj | Where-Object { $_.Name -match '(?i)test' }

          if ($testProjects.Count -eq 0) {
            Write-Host "No test projects found. Skipping tests."
            exit 0
          }

          foreach ($project in $testProjects) {
            Write-Host "Running tests for $($project.FullName)"
            dotnet test $project.FullName --configuration Release --verbosity normal --results-directory ./TestResults --collect:"XPlat Code Coverage"
          }

      - name: Coverage quality gate
        shell: pwsh
        env:
          COVERAGE_THRESHOLD: "0.70"
        run: |
          $threshold = [double]$env:COVERAGE_THRESHOLD
          $coverageFiles = Get-ChildItem -Path ./TestResults -Recurse -Filter coverage.cobertura.xml

          if ($coverageFiles.Count -eq 0) {
            throw "Coverage files were not generated."
          }

          [double]$covered = 0
          [double]$valid = 0

          foreach ($file in $coverageFiles) {
            [xml]$report = Get-Content -Raw -Path $file.FullName
            $covered += [double]$report.coverage.'lines-covered'
            $valid += [double]$report.coverage.'lines-valid'
          }

          if ($valid -le 0) {
            throw "Invalid coverage report: total valid lines is zero."
          }

          $coverage = $covered / $valid
          $coveragePercent = [math]::Round($coverage * 100, 2)
          $thresholdPercent = [math]::Round($threshold * 100, 2)

          Write-Host "Total line coverage: $coveragePercent% (threshold: $thresholdPercent%)"
          "## Coverage`n`n- Total line coverage: $coveragePercent%`n- Threshold: $thresholdPercent%" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

          if ($coverage -lt $threshold) {
            throw "Coverage $coveragePercent% is below threshold $thresholdPercent%."
          }
