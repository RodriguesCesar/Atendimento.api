name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Atendimento.api.slnx

      - name: Build
        run: dotnet build Atendimento.api.slnx --configuration Release --no-restore

      - name: Test projects
        shell: pwsh
        run: |
          $testProjects = Get-ChildItem -Path . -Recurse -Filter *.csproj | Where-Object { $_.Name -match '(?i)test' }

          if ($testProjects.Count -eq 0) {
            Write-Host "No test projects found. Skipping tests."
            exit 0
          }

          foreach ($project in $testProjects) {
            Write-Host "Running tests for $($project.FullName)"
            dotnet test $project.FullName --configuration Release --verbosity normal --collect:"XPlat Code Coverage"
          }
